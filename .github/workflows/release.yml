name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build_script: bash scripts/build_release.sh
            asset_glob: src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-latest
            build_script: bash scripts/build_release.sh
            asset_glob: src-tauri/target/release/bundle/deb/*.deb
          - os: windows-latest
            build_script: pwsh scripts/build_release.ps1
            asset_glob: src-tauri/target/release/bundle/zip/*.zip

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            xz-utils \
            unzip

      - name: Exclude workspace from Windows Defender
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build release bundle
        run: ${{ matrix.build_script }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_glob }}
          fail_on_unmatched_files: true
          generate_release_notes: true
